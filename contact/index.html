<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — The Resilience Architect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<header class="site">
  <div class="wrap">
    <a class="brand" href="/">The Resilience Architect</a>
    <nav class="site-nav">
      <a href="/">Home</a>
      <a href="/resilience/">Why Resilience?</a>
      <a href="/blog/">Blog</a>
      <a href="/about/">About</a>
      <a href="/contact/" class="active">Contact me</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <h1>Contact Me</h1>
    <p class="lede">Use the form below or contact me directly at:</p>
    <p><a href="mailto:santi.strasser@gmail.com">santi.strasser@gmail.com</a><br>+1 (612) 308-9567</p>

    <form class="form-grid" action="#" method="POST" style="margin-top:2rem;">
      <div class="form-row">
        <div>
          <label for="fname">First Name (required)</label>
          <input id="fname" name="fname" required>
        </div>
        <div>
          <label for="lname">Last Name (required)</label>
          <input id="lname" name="lname" required>
        </div>
      </div>
      <div>
        <label for="email">Email (required)</label>
        <input id="email" name="email" type="email" required>
      </div>
      <div>
        <label for="message">Message (required)</label>
        <textarea id="message" name="message" required></textarea>
      </div>
      <button class="submit" type="submit">Send</button>
    </form>
  </div>
</main>

<footer class="site">
  <div class="wrap">
    <p>&copy; <span id="y"></span> Santi Strasser — The Resilience Architect</p>
  </div>
</footer>
<script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
