<main id="main">
  <div class="wrap">
    <h1>Contact Me</h1>
    <p class="lede">Use the form below or contact me directly at:</p>
    <p class="contact-lines">s a n t i . s t r a s s e r @ g m a i l . c o m<br>+ 1 6 1 2 - 3 0 8 - 9 5 6 7</p>

    <form class="form-grid w3f-form" action="https://api.web3forms.com/submit" method="POST" style="margin-top:2rem;">
      <input type="hidden" name="access_key" value="ce5b6eca-7dd7-4cbc-a7a3-a1f1ad766218">
      <input type="hidden" name="subject" value="New message from santistrasser.com – Contact">
      <input type="checkbox" name="botcheck" class="hp-field" tabindex="-1" autocomplete="off">
      <div class="form-row">
        <div>
          <label for="fname">First Name (required)</label>
          <input id="fname" name="First Name" autocomplete="given-name" required>
        </div>
        <div>
          <label for="lname">Last Name (required)</label>
          <input id="lname" name="Last Name" autocomplete="family-name" required>
        </div>
      </div>
      <div>
        <label for="email">Email (required)</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div>
        <label for="message">Message (required)</label>
        <textarea id="message" name="message" required></textarea>
      </div>
      <button class="submit" type="submit">Send</button>
      <p class="form-status" role="status"></p>
    </form>
  </div>
</main>
